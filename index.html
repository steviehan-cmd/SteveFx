<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SteveFx">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>SteveFx</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e3e7ec;--acc:#0b8f63;--acc-soft:#e2f5ed;--key:#fff;--key2:#e6ebf0;--up:#059669;--down:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06);--on-acc:#fff;--tray:#fff;--tkey:#eef1f4;--tkey2:#e2e7ec;--handle:#d5dbe1;--tshadow:0 -4px 16px rgba(0,0,0,.08);--star:#b45309;--star-soft:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1117;--card:#141c25;--text:#e8edf2;--muted:#8794a1;--line:#222c37;--acc:#34d399;--acc-soft:#10291f;--key:#18212b;--key2:#222e3b;--up:#34d399;--down:#f87171;--shadow:none;--on-acc:#062016;--tray:#18222d;--tkey:#223040;--tkey2:#1a2734;--handle:#3a4756;--tshadow:0 -6px 20px rgba(0,0,0,.45);--star:#fbbf24;--star-soft:#33290f}}
/* Custom mode uses violet instead of green */
body.custom{--acc:#7c3aed;--acc-soft:#f1eafe;--on-acc:#fff}
@media (prefers-color-scheme:dark){body.custom{--acc:#a78bfa;--acc-soft:#221a3d;--on-acc:#1b1236}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--acc)}
/* Rate mode: a dropdown (two taps to change, so it is not switched by accident) */
.modewrap{position:relative;margin-left:auto}
.modebtn{border:0;background:var(--key2);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.modebtn .md{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.modebtn .dd{font-size:10px;color:var(--muted)}
#modeMenu{position:absolute;top:calc(100% + 6px);right:0;z-index:15;width:230px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.28);padding:5px}
#modeMenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px}
#modeMenu button.on{background:var(--key2)}
#modeMenu b{display:block;font-size:15px}#modeMenu small{display:block;color:var(--muted);font-size:12px}
#modeMenu .md{width:10px;height:10px;border-radius:50%;flex:none}#modeMenu .md.g{background:#10b981}#modeMenu .md.v{background:#8b5cf6}
#modeMenu .tick{margin-left:auto;color:var(--text);font-weight:800;visibility:hidden}#modeMenu .on .tick{visibility:visible}
header .hb{white-space:nowrap;border:0;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:14px;padding:7px 12px;border-radius:9px}
.statusline{display:flex;align-items:center;gap:8px;padding:2px 14px 8px;font-size:12.5px;color:var(--muted)}
.statusline .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.statusline .dot.on{background:var(--up)}
.statusline button{margin-left:auto;border:0;background:transparent;color:var(--acc);font-weight:700;font-size:13px;padding:4px 2px}
.spin{opacity:.5}
.statusline .sr{margin-left:auto;display:flex;gap:14px;flex:none}
.statusline .sr button{margin-left:0}
.statusline .cmpbtn{color:var(--star)}
#stamp,#cstamp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ☆ on the highlighted row saves the price for comparing */
.row .star{flex:none;width:34px;height:34px;border:0;border-radius:9px;background:var(--star-soft);color:var(--star);font-size:18px;line-height:1;padding:0;margin-left:2px}
main{flex:1;overflow-y:auto;padding:0 12px 12px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:11px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.row.active{border-color:var(--acc);background:var(--acc-soft)}
.row.dim{opacity:.45}
.flag{font-size:26px;line-height:1;width:32px;text-align:center;flex:none}
.cc{min-width:0;flex:none;max-width:42%}
.cc b{display:block;font-size:16px}
.cc small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{flex:1;text-align:right;min-width:0}
.val .big{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums;word-break:break-all}
.val small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row.active .big{color:var(--acc)}
.ctl{display:flex;gap:4px;flex:none}
.ctl button{border:0;background:var(--key2);width:32px;height:32px;border-radius:8px;font-size:15px}
.ctl .rm{color:var(--down)}
.addrow{display:block;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--acc);font-weight:700;border-radius:14px;padding:12px;margin-top:2px}
.empty{background:var(--card);border-radius:14px;padding:16px;color:var(--muted);font-size:14px;margin-bottom:8px;line-height:1.45}
.empty b{color:var(--text)}
.pos{color:var(--up);font-weight:700}.neg{color:var(--down);font-weight:700}
.hidden{display:none!important}
/* "Your custom rates" list: small edit / delete buttons beside each rate */
#rList{flex:1;overflow-y:auto}
#rList .row{background:var(--bg)}
.ra{display:flex;flex-direction:column;gap:6px;flex:none;margin-left:2px}
.ra button{border:0;background:var(--key2);width:26px;height:26px;border-radius:7px;font-size:13px;line-height:1;padding:0;color:var(--muted)}
.ra .d{color:var(--down)}
.hint{color:var(--muted);font-size:12px;text-align:center;margin:4px 0 10px}
.mktline{font-size:13px;color:var(--muted);margin:-4px 0 12px;line-height:1.45}
.mktline:empty{display:none}
.mktline.warn{color:var(--text);margin:0 0 12px}
/* keypad: a raised tray; tap or drag the handle to slide it down/up */
#pad{background:var(--tray);border-radius:24px 24px 0 0;box-shadow:var(--tshadow);position:relative;z-index:1;padding:0 10px env(safe-area-inset-bottom);transition:padding .25s ease}
#pad.collapsed{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
#padHandle{display:block;width:100%;height:24px;border:0;background:transparent;padding:0;position:relative;touch-action:none}
#padHandle::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--handle)}
#keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:50px;gap:6px;padding-bottom:10px;max-height:284px;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
#pad.collapsed #keys{max-height:0;padding-bottom:0}
#keys.drag{transition:none}
#keys button{border:0;border-radius:12px;background:var(--tkey);font-size:22px;touch-action:none;-webkit-touch-callout:none;transition:transform .08s ease,filter .08s ease}
#keys button.press{filter:brightness(.82);transform:scale(.94)}
@media (prefers-color-scheme:dark){#keys button.press{filter:brightness(1.6)}}
#keys .op{background:var(--tkey2);color:var(--acc);font-weight:600}
#keys .eq{background:var(--acc);color:var(--on-acc);font-weight:700}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet.hidden{display:none}
.sheet-card{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}
.sheet-card.tall{height:85dvh;display:flex;flex-direction:column}
.sheet-card h3{margin:0 0 12px;font-size:18px}
.sheet label,.fld{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.sheet input,.sheet select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px}
.two{display:flex;gap:8px;align-items:flex-end}
.two label,.two .fld{flex:1;min-width:0}
.cur{display:flex;align-items:center;gap:6px;width:100%;margin-top:4px;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;text-align:left;white-space:nowrap;overflow:hidden}
.cur small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.swap{border:0;background:var(--key2);border-radius:10px;width:44px;height:46px;margin-bottom:10px;font-size:18px;flex:none}
.link{border:0;background:transparent;color:var(--acc);font-weight:700;font-size:14px;padding:0 0 12px}
details{margin-bottom:10px;font-size:14px}
summary{color:var(--acc);font-weight:700;padding:2px 0 10px}
.actions{display:flex;gap:10px;margin-top:6px}
.actions button{flex:1;border:0;border-radius:11px;padding:13px;font-weight:700;background:var(--key2)}
.actions .primary{background:var(--acc);color:var(--on-acc)}
#pSearch{margin:0 0 10px}
#pList{flex:1;overflow-y:auto}
.pi{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pi .flag{font-size:22px}
.pi small{color:var(--muted);display:block;font-size:12.5px}
.pi .tick{margin-left:auto;color:var(--acc);font-weight:800}
/* Edit (reorder) mode: keypad slides away, amounts and other controls fade; only ▲/✕ and Done stay live */
.modebtn,.hb,.statusline>*,.cmpbtn,.row,.val,.cc,.addrow{transition:opacity .2s ease,background-color .2s ease,border-color .2s ease}
#pad{transition:padding .25s ease,opacity .25s ease}
body.editing .modebtn,body.editing header .hb,body.editing .statusline>:not(.sr),body.editing .statusline .cmpbtn{opacity:.35;pointer-events:none}
body.editing #pad{opacity:.35;pointer-events:none;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
body.editing #keys{max-height:0;padding-bottom:0}
body.editing #list .row .val{opacity:.3}
body.editing #list .row.active{border-color:transparent;background:var(--card)}
body.editing #list .row.active .big{color:inherit}
body.editing #list .row.dim{opacity:1}
body.editing #list .row.dim .cc,body.editing #list .row.dim .flag{opacity:.45}
body.custom.editing #list .addrow{opacity:.35;pointer-events:none}
/* Save price + Compare sheets */
.preview{background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.preview .p1{font-size:24px;font-weight:700;color:var(--acc)}.preview .p2{color:var(--muted);font-size:13.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}.chips:empty{display:none}
.chip{border:0;background:var(--key2);border-radius:14px;padding:5px 11px;font-size:13px;flex:none}
.chip.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
.sheet-card h3{display:flex;align-items:center}
#cmpClear{margin-left:auto;padding:0;color:var(--down);font-size:13px}
.vin{display:flex;align-items:center;gap:6px;overflow-x:auto;font-size:13px;color:var(--muted);margin-bottom:12px;padding-bottom:2px;flex:none}
#cmpList{flex:1;overflow-y:auto}
.grp{background:var(--bg);border-radius:12px;padding:10px 12px 4px;margin-bottom:9px}
.grp .gh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.grp .gh b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gh small{margin-left:auto;color:var(--muted);font-size:12px;flex:none}
.gr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.gr .shop{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr .shop small{display:block;color:var(--muted);font-size:11.5px}
.gr .pr{text-align:right;flex:none}.gr .pr b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.gr .pr small{display:block;color:var(--muted);font-size:11.5px}
.badge{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);flex:none}
.more{font-size:12px;font-weight:700;color:var(--down);flex:none}
.gr .del{flex:none;width:26px;height:26px;border:0;border-radius:7px;background:var(--key2);color:var(--down);font-size:13px;padding:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Steve<span>Fx</span></h1>
  <div class="modewrap">
    <button id="modeBtn" class="modebtn" aria-haspopup="true"><span class="md"></span><span id="modeName">Market</span><span class="dd">▾</span></button>
    <div id="modeMenu" class="hidden">
      <button data-mode="latest"><span class="md g"></span><span><b>Market</b><small>Live exchange rates</small></span><span class="tick">✓</span></button>
      <button data-mode="custom"><span class="md v"></span><span><b>Mine</b><small>Your own rates</small></span><span class="tick">✓</span></button>
    </div>
  </div>
  <button id="refresh" class="hb">↻ Refresh</button><button id="manage" class="hb hidden">Rates</button>
</header>
<div id="status" class="statusline"><span class="dot" id="dot"></span><span id="stamp">No rates yet</span><span class="sr"><button class="cmpbtn hidden">★ Compare</button><button class="arrange">⇅ Order</button></span></div>
<div id="cstatus" class="statusline hidden"><span id="cstamp"></span><span class="sr"><button class="cmpbtn hidden">★ Compare</button><button class="arrange">⇅ Order</button></span></div>
<main id="list"></main>
<div id="pad">
  <button id="padHandle" aria-label="Show or hide keypad"></button>
  <div id="keys">
    <button class="op" data-k="C">C</button><button class="op" data-k="⌫">⌫</button><button class="op" data-k="%">%</button><button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button data-k="000">000</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
  </div>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-card">
    <h3 id="sTitle">Add custom rate</h3>
    <div class="two">
      <div class="fld">From<button class="cur" id="fFrom" type="button"></button></div>
      <button class="swap" id="fSwap" title="Swap" type="button">⇄</button>
      <div class="fld">To<button class="cur" id="fTo" type="button"></button></div>
    </div>
    <div class="mktline warn" id="fDup"></div>
    <label>Rate: 1 <span id="lFrom">USD</span> = how many <span id="lTo">IDR</span>?<input id="fRate" inputmode="decimal" placeholder="e.g. 16250" autocomplete="off"></label>
    <button class="link" id="fLatest">Fill with latest market rate</button>
    <div class="mktline" id="fMkt"></div>
    <details id="fCalc"><summary>Or work it out from the amounts</summary>
      <div class="two">
        <label>I gave (<span id="lGave">USD</span>)<input id="fGave" inputmode="decimal" placeholder="500"></label>
        <label>I got (<span id="lGot">IDR</span>)<input id="fGot" inputmode="decimal" placeholder="8,125,000"></label>
      </div>
    </details>
    <label>Note (optional)<input id="fNote" placeholder="e.g. Money changer, Kuta" autocomplete="off"></label>
    <label>Date<input id="fDate" type="date"></label>
    <div class="actions"><button id="fCancel">Cancel</button><button id="fSave" class="primary">Save</button></div>
  </div>
</div>

<div id="picker" class="sheet hidden">
  <div class="sheet-card tall">
    <h3 id="pTitle">Add currencies</h3>
    <input id="pSearch" placeholder="Search code or name" autocomplete="off">
    <div id="pList"></div>
    <div class="actions"><button id="pClose" class="primary">Done</button></div>
  </div>
</div>
<div id="rates" class="sheet hidden">
  <div class="sheet-card tall">
    <h3>Your custom rates</h3>
    <div id="rList"></div>
    <div class="actions"><button id="rClose" class="primary">Done</button></div>
  </div>
</div>
<div id="saveSheet" class="sheet hidden">
  <div class="sheet-card">
    <h3>Save price</h3>
    <div class="preview"><div class="p1" id="svPrice"></div><div class="p2" id="svIn"></div></div>
    <label>Item<input id="svItem" placeholder="e.g. Kopi Luwak 100g" autocomplete="off"></label>
    <div class="chips" id="svItems"></div>
    <label>Shop<input id="svShop" placeholder="e.g. Pasar Badung" autocomplete="off"></label>
    <div class="chips" id="svShops"></div>
    <div class="actions"><button id="svCancel">Cancel</button><button id="svSave" class="primary">Save</button></div>
  </div>
</div>
<div id="cmpSheet" class="sheet hidden">
  <div class="sheet-card tall">
    <h3>Compare prices<button class="link" id="cmpClear">Clear all</button></h3>
    <div class="vin" id="cmpIn"></div>
    <div id="cmpList"></div>
    <div class="actions"><button id="cmpClose" class="primary">Done</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('stevefx.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('stevefx.' + k, JSON.stringify(v)); } catch (e) {} }
};
const ZERO = new Set(['IDR','JPY','KRW','VND','CLP','HUF','ISK','PYG','UGX','LAK','MMK','KHR','IRR','COP','KZT','UZS']);
const COMMON = ['USD','EUR','GBP','JPY','CNY','SGD','MYR','THB','IDR','AUD','NZD','HKD','KRW','INR','PHP','VND','TWD','CHF','CAD','AED','SAR','TRY','ZAR'];
const OPS = /[+−×÷]/;

const S = {
  mode: LS.get('mode', 'latest'),
  favs: LS.get('favs', ['IDR','USD','SGD','EUR','JPY','AUD']),
  rates: LS.get('rates', null),          // {rates:{USD:1,...}, time, fetched, source}
  active: LS.get('active', 'USD'),
  expr: LS.get('expr', '1'),
  custom: LS.get('custom', []),          // [{id,from,to,rate,note,date}]: one rate per currency pair
  corder: LS.get('corder', []),          // display order of the currencies in Custom mode
  cActive: LS.get('cactive', null),      // highlighted currency in Custom mode
  cExpr: LS.get('cexpr', '100'),
  padHidden: LS.get('padhidden', false), // keypad slid down
  saved: LS.get('saved', []),            // starred prices: [{id,item,shop,amount,cur,t}]
  cmpCur: LS.get('cmpcur', null),        // currency the Compare list is shown in
  editing: false, loading: false, fresh: true, editId: null, pickFor: null
};
function save() {
  LS.set('mode', S.mode); LS.set('favs', S.favs); LS.set('active', S.active); LS.set('expr', S.expr); LS.set('custom', S.custom);
  LS.set('corder', S.corder); LS.set('cactive', S.cActive); LS.set('cexpr', S.cExpr); LS.set('padhidden', S.padHidden);
  LS.set('saved', S.saved); LS.set('cmpcur', S.cmpCur);
}

/* ---------- helpers ---------- */
let DN = null; try { DN = new Intl.DisplayNames(['en'], { type: 'currency' }); } catch (e) {}
function nameOf(c) { try { return DN ? DN.of(c) : c; } catch (e) { return c; } }
function flagOf(c) {
  if (c === 'EUR') return '🇪🇺';
  if (c[0] === 'X') return '🪙';
  return String.fromCodePoint(...[...c.slice(0, 2)].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function decimals(v, c) {
  const a = Math.abs(v);
  if (a > 0 && a < 0.01) return 6;
  if (a > 0 && a < 1) return 4;
  return ZERO.has(c) ? 0 : 2;
}
function fmt(v, c) {
  if (!isFinite(v)) return '—';
  const d = decimals(v, c);
  return v.toLocaleString('en-US', { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d });
}
function fmtRate(v) {
  if (!isFinite(v)) return '—';
  return v.toLocaleString('en-US', { maximumFractionDigits: v >= 100 ? 2 : v >= 1 ? 4 : 8 });
}
// Works out a typed sum. × and ÷ go before + and −. % works like a phone calculator:
// 200 + 15% = 230, 200 − 10% = 180, 200 × 15% = 30, 15% on its own = 0.15.
function evalExpr(s) {
  const t = String(s).replace(/,/g, '').replace(/[+−×÷.]+$/, '');
  if (!t) return 0;
  const parts = t.split(/([+−×÷])/);   // number, operator, number, ...
  const num = p => { const m = /^(-?(?:\d+\.?\d*|\.\d+))(%?)$/.exec(p); return m ? { v: +m[1], pct: !!m[2] } : null; };
  let sum = 0, sign = 1, term = null;
  for (let i = 0; i < parts.length; i += 2) {
    const n = num(parts[i]); if (!n) return NaN;
    const op = i ? parts[i - 1] : null, val = n.pct ? n.v / 100 : n.v;
    if (op === '×') term *= val;
    else if (op === '÷') term /= val;
    else {
      if (term !== null) sum += sign * term;
      sign = op === '−' ? -1 : 1;
      const pctOfSoFar = op && n.pct && parts[i + 1] !== '×' && parts[i + 1] !== '÷';
      term = pctOfSoFar ? sum * n.v / 100 : val;   // "+ 15%" means 15% of the total so far
    }
  }
  sum += sign * term;
  return isFinite(sum) ? sum : NaN;
}
const CALC = /[+−×÷%]/;   // the amount is a sum, so show "= result" under it
function fmtExpr(e) {
  return String(e).replace(/\d+(\.\d*)?/g, m => {
    const [i, d] = m.split('.');
    return Number(i).toLocaleString('en-US') + (d !== undefined ? '.' + d : '');
  }).replace(/([+−×÷])/g, ' $1 ');
}
function plain(v, c) { return isFinite(v) ? String(+v.toFixed(decimals(v, c))) : '0'; }
function convert(v, from, to) {
  const r = S.rates && S.rates.rates;
  if (!r || !r[from] || !r[to]) return NaN;
  return v / r[from] * r[to];
}
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
}
function fmtDate(s) { return s ? new Date(s + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
function pctHtml(d, words) {
  if (!isFinite(d)) return '';
  const p = d >= 0;
  return `<span class="${p ? 'pos' : 'neg'}">${p ? '+' : ''}${d.toFixed(2)}%${words ? (p ? ' better' : ' worse') : ''}</span>`;
}
function rowHtml(o) {    // one currency row; used by Latest, Custom and the custom-rates list
  return `<div class="row${o.active ? ' active' : ''}${o.cls ? ' ' + o.cls : ''}" ${o.attrs || ''}>${o.pre || ''}<span class="flag">${flagOf(o.flag)}</span><div class="cc"><b>${o.title}</b><small>${esc(o.sub)}</small></div><div class="val"><div class="big">${o.big}</div>${(o.smalls || []).filter(Boolean).map(s => '<small>' + s + '</small>').join('')}</div>${o.post || ''}</div>`;
}
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function allCodes() {
  const r = S.rates && S.rates.rates;
  const codes = r ? Object.keys(r).filter(c => /^[A-Z]{3}$/.test(c) && nameOf(c) !== c) : COMMON.slice();
  const extra = S.favs.concat(S.custom.flatMap(x => [x.from, x.to]));
  return [...new Set(codes.concat(extra))].sort();
}

/* ---------- custom rates ---------- */
// The saved rate for a currency pair, in either direction (skipId: ignore that rate).
function pairOf(a, b, skipId) { return S.custom.find(x => x.id !== skipId && ((x.from === a && x.to === b) || (x.from === b && x.to === a))) || null; }
// 1 a = r b, using your own rate for that pair; null if you have no rate for it.
function directRate(a, b) {
  const x = pairOf(a, b);
  return x ? { x, r: x.from === a ? x.rate : 1 / x.rate } : null;
}
// Keep Custom mode's currency list and highlighted currency in step with the saved rates.
function syncCustom() {
  const codes = [];
  S.custom.slice().reverse().forEach(x => [x.from, x.to].forEach(c => { if (!codes.includes(c)) codes.push(c); }));
  S.corder = S.corder.filter(c => codes.includes(c)).concat(codes.filter(c => !S.corder.includes(c)));
  if (!S.corder.includes(S.cActive)) { S.cActive = S.corder[0] || null; S.cExpr = '100'; }
  save();
}

/* ---------- rates ---------- */
async function fetchRates(manual) {
  if (S.loading) return;
  if (!navigator.onLine) { if (manual) toast('You\'re offline — using saved rates'); return; }
  S.loading = true; renderStatus();
  let data = null;
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' });
    const j = await r.json();
    if (j.result === 'success') data = { rates: j.rates, time: j.time_last_update_unix * 1000, fetched: Date.now(), source: 'open.er-api.com' };
  } catch (e) {}
  if (!data) {
    try {
      const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json', { cache: 'no-store' });
      const j = await r.json(); const rates = {};
      for (const [k, v] of Object.entries(j.usd)) if (/^[a-z]{3}$/.test(k) && v > 0) rates[k.toUpperCase()] = v;
      data = { rates, time: Date.parse(j.date), fetched: Date.now(), source: 'currency-api' };
    } catch (e) {}
  }
  S.loading = false;
  if (data) { S.rates = data; LS.set('rates', data); if (manual) toast('Rates updated'); }
  else if (manual) toast('Couldn\'t reach the rate servers');
  render();
}

/* ---------- render ---------- */
function renderStatus() {
  $('#dot').classList.toggle('on', navigator.onLine);
  const b = $('#refresh'); b.classList.toggle('spin', S.loading); b.textContent = S.loading ? 'Updating…' : '↻ Refresh';
  if (!S.rates) { $('#stamp').textContent = navigator.onLine ? 'No rates yet' : 'Offline · no rates saved yet'; return; }
  const t = new Date(S.rates.time).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('#stamp').textContent = 'Rates ' + t + ' · ' + ago(S.rates.fetched) + (navigator.onLine ? '' : ' · offline');
}

function renderLatest() {
  const amt = evalExpr(S.expr);
  let h = '';
  if (!S.rates) h += '<div class="empty"><b>No market rates saved yet.</b><br>Connect to the internet once and tap Refresh. After that, conversions work offline using the last saved rates. Mine mode works without any download.</div>';
  h += S.favs.map((c, i) => {
    const act = c === S.active;
    let big, sub;
    if (act) {
      big = fmtExpr(S.expr);
      sub = CALC.test(S.expr) ? '= ' + fmt(amt, c) : '';
    } else {
      big = fmt(convert(amt, S.active, c), c);
      const r = convert(1, S.active, c);
      sub = isFinite(r) ? '1 ' + S.active + ' = ' + fmtRate(r) + ' ' + c : '';
    }
    const ctl = S.editing ? `<div class="ctl"><button data-act="up" data-i="${i}" ${i ? '' : 'disabled style="opacity:.3"'}>▲</button><button class="rm" data-act="rm" data-i="${i}">✕</button></div>` : '';
    return rowHtml({ attrs: `data-code="${c}"`, active: act, flag: c, title: c, sub: nameOf(c), big, smalls: [sub], pre: ctl, post: act && !S.editing ? '<button class="star" data-act="star" aria-label="Save this price to compare">☆</button>' : '' });
  }).join('');
  h += '<button class="addrow" data-act="add">+ Add currency</button>';
  $('#list').innerHTML = h;
}

// Custom mode: the highlighted currency plus every currency you have a direct custom rate with.
// While editing (reordering), all your custom currencies are shown.
function renderCustom() {
  if (!S.custom.length) {
    $('#list').innerHTML = '<div class="empty"><b>No custom rates yet.</b><br>Save the rate you actually exchanged at (e.g. a money changer). You can enter the rate directly, or the amounts you gave and got. Convert with it any time, offline.</div><button class="addrow" data-act="addrate">+ Add custom rate</button>';
    return;
  }
  const a = S.cActive, v = evalExpr(S.cExpr);
  const codes = S.editing ? S.corder : S.corder.filter(c => c === a || directRate(a, c));
  $('#list').innerHTML = codes.map(c => {
    const i = S.corder.indexOf(c), act = c === a, d = act ? null : directRate(a, c);
    let big, smalls;
    if (act) { big = fmtExpr(S.cExpr); smalls = [CALC.test(S.cExpr) ? '= ' + fmt(v, c) : '']; }
    else if (d) {
      big = fmt(v * d.r, c);
      smalls = ['1 ' + a + ' = ' + fmtRate(d.r) + ' ' + c];
    } else { big = '—'; smalls = ['No rate with ' + a]; }
    const ctl = S.editing ? `<div class="ctl"><button data-act="up" data-i="${i}" ${i ? '' : 'disabled style="opacity:.3"'}>▲</button></div>` : '';
    return rowHtml({ attrs: `data-code="${c}"`, active: act, cls: !act && !d ? 'dim' : '', flag: c, title: c, sub: nameOf(c), big, smalls, pre: ctl, post: act && !S.editing ? '<button class="star" data-act="star" aria-label="Save this price to compare">☆</button>' : '' });
  }).join('') + '<button class="addrow" data-act="addrate">+ Add custom rate</button>';
}

function render() {
  const custom = S.mode === 'custom';
  if (custom) syncCustom();
  document.body.classList.toggle('custom', custom);
  document.body.classList.toggle('editing', S.editing);
  $('#modeName').textContent = custom ? 'Mine' : 'Market';
  document.querySelectorAll('#modeMenu [data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  document.querySelectorAll('.cmpbtn').forEach(b => { b.textContent = '★ Compare ' + S.saved.length; b.classList.toggle('hidden', !S.saved.length); });
  document.querySelectorAll('.arrange').forEach(b => { b.textContent = S.editing ? 'Done' : '⇅ Order'; b.classList.toggle('hidden', custom && !S.custom.length); });
  $('#refresh').classList.toggle('hidden', custom);
  $('#status').classList.toggle('hidden', custom);
  $('#cstatus').classList.toggle('hidden', !custom);
  renderStatus();
  if (custom) {
    const n = S.custom.length;
    $('#cstamp').textContent = n ? n + ' custom rate' + (n === 1 ? '' : 's') : 'No custom rates yet';
    $('#manage').classList.toggle('hidden', !n);
  } else $('#manage').classList.add('hidden');

/* ---------- keypad ---------- */
function press(k) {
  const custom = S.mode === 'custom';
  if (!k || S.editing || (custom && !S.cActive)) return;
  let e = custom ? S.cExpr : S.expr;
  const digit = /^(\d|000)$/.test(k) || k === '.';
  if (S.fresh && digit) e = '0';
  S.fresh = false;
  if (digit && e.endsWith('%')) e += '×';   // "15%" then 4 → "15% × 4"
  if (k === 'C') e = '0';
  else if (k === '%') { if (/[+−×÷%]$/.test(e)) return; e = e.replace(/\.$/, '') + '%'; }
  else if (k === '⌫') e = e.length > 1 ? e.slice(0, -1) : '0';
  else if (k === '=') { const v = evalExpr(e); e = isFinite(v) ? String(+v.toFixed(8)) : '0'; S.fresh = true; }
  else if (OPS.test(k)) { e = /[+−×÷.]$/.test(e) ? e.slice(0, -1) + k : e + k; }
  else if (k === '.') { const seg = e.split(OPS).pop(); if (!seg.includes('.')) e += seg === '' ? '0.' : '.'; }
  else {
    const seg = e.split(OPS).pop();
    if (seg === '0') e = e.slice(0, -1) + (k === '000' ? '0' : k);
    else if (seg === '' && k === '000') e += '0';
    else e += k;
  }
  if (e.length > 40) return;
  if (custom) S.cExpr = e; else S.expr = e;
  save(); render();
}
// Keys type the moment a finger touches them (not on "click"), so fast or overlapping taps
// and a slightly sliding thumb never get dropped. Holding ⌫ keeps deleting.
const held = new Map();   // pointerId -> { b, t0, rep }
function keyUp(ev) {
  const h = held.get(ev.pointerId); if (!h) return;
  held.delete(ev.pointerId); clearTimeout(h.rep); clearInterval(h.rep);
  setTimeout(() => h.b.classList.remove('press'), Math.max(0, 110 - (Date.now() - h.t0)));   // let quick taps flash
}
$('#keys').addEventListener('pointerdown', ev => {
  const b = ev.target.closest('button[data-k]');
  if (!b || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
  ev.preventDefault();
  b.classList.add('press');
  press(b.dataset.k);
  const h = { b, t0: Date.now(), rep: null };
  if (b.dataset.k === '⌫') h.rep = setTimeout(() => { h.rep = setInterval(() => press('⌫'), 70); }, 450);
  held.set(ev.pointerId, h);
});
window.addEventListener('pointerup', keyUp);
window.addEventListener('pointercancel', keyUp);
$('#keys').addEventListener('contextmenu', ev => ev.preventDefault());
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input,select') || S.editing) return;
  if (document.querySelector('.sheet:not(.hidden)')) return;
  const map = { '*': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', '=': '=', 'Backspace': '⌫', 'Escape': 'C', '.': '.', ',': '.', '%': '%' };
  const k = /^\d$/.test(ev.key) ? ev.key : map[ev.key];
  if (k) { ev.preventDefault(); press(k); }
});

// Keypad tray: tap the handle to slide it down/up, or drag it.
const KEYS_H = 284;   // full height of the key grid (5 rows of 50px + gaps + padding)
function setPad(hidden) { S.padHidden = hidden; save(); $('#pad').classList.toggle('collapsed', hidden); }
function showPad() { if (S.padHidden) setPad(false); }
let pd = null, padNoClickUntil = 0;
const hdl = $('#padHandle'), keysEl = $('#keys');
hdl.addEventListener('pointerdown', ev => {
  pd = { y0: ev.clientY, h0: S.padHidden ? 0 : KEYS_H, dy: 0 };
  try { hdl.setPointerCapture(ev.pointerId); } catch (e) {}
});
hdl.addEventListener('pointermove', ev => {
  if (!pd) return;
  pd.dy = ev.clientY - pd.y0;
  if (Math.abs(pd.dy) > 4) { keysEl.classList.add('drag'); keysEl.style.maxHeight = Math.max(0, Math.min(KEYS_H, pd.h0 - pd.dy)) + 'px'; }
});
function padRelease() {
  if (!pd) return;
  const dy = pd.dy; pd = null;
  keysEl.classList.remove('drag'); keysEl.style.maxHeight = '';
  if (Math.abs(dy) > 4) {          // it was a drag, not a tap
    padNoClickUntil = Date.now() + 400;
    if (dy > 30) setPad(true); else if (dy < -30) setPad(false);
  }
}
hdl.addEventListener('pointerup', padRelease);
hdl.addEventListener('pointercancel', padRelease);
hdl.addEventListener('click', () => { if (Date.now() < padNoClickUntil) return; setPad(!S.padHidden); });

/* ---------- main list ---------- */
function setActive(c) {   // Latest mode
  showPad();
  if (c === S.active) return;
  const v = convert(evalExpr(S.expr), S.active, c);
  if (isFinite(v)) S.expr = plain(v, c);
  S.active = c; S.fresh = true; save(); render();
}
function setCActive(c) {  // Custom mode: carry the amount over using your rate for that pair
  showPad();
  if (c === S.cActive) return;
  const d = directRate(S.cActive, c);
  S.cExpr = d ? plain(evalExpr(S.cExpr) * d.r, c) : '100';
  S.cActive = c; S.fresh = true; save(); render();
}
$('#list').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (S.mode === 'latest') {
    if (b) {
      const i = +b.dataset.i, a = b.dataset.act;
      if (a === 'star') return openSave();
      if (a === 'add') return openPicker(null);
      if (a === 'rm') {
        if (S.favs.length <= 2) return toast('Keep at least 2 currencies');
        const c = S.favs[i]; S.favs.splice(i, 1);
        if (c === S.active) { S.active = S.favs[0]; S.expr = '1'; }
      }
      if (a === 'up' && i > 0) [S.favs[i - 1], S.favs[i]] = [S.favs[i], S.favs[i - 1]];
      save(); return render();
    }
    const row = ev.target.closest('.row'); if (row && !S.editing) setActive(row.dataset.code);
    return;
  }
  // custom mode
  if (b) {
    const i = +b.dataset.i, a = b.dataset.act;
    if (a === 'star') return openSave();
    if (a === 'addrate') return S.editing ? undefined : openSheet(null);
    if (a === 'up' && i > 0) { [S.corder[i - 1], S.corder[i]] = [S.corder[i], S.corder[i - 1]]; save(); render(); }
    return;
  }
  const row = ev.target.closest('.row'); if (row && !S.editing) setCActive(row.dataset.code);
});

/* ---------- "Your custom rates" (Rates button): tap a rate to edit it; the small ✕ deletes it ---------- */
function renderRates() {
  $('#rList').innerHTML = S.custom.map(x => `<div class="rr" data-id="${x.id}">${
    rowHtml({ flag: x.from, title: x.from + ' → ' + x.to, sub: [x.note, fmtDate(x.date)].filter(Boolean).join(' · '), big: fmtRate(x.rate),
      post: '<div class="ra"><button class="d" data-act="del" aria-label="Delete">✕</button></div>' })
  }</div>`).join('') + '<button class="addrow" data-act="addrate">+ Add custom rate</button>';
}
function openRates() { renderRates(); $('#rates').classList.remove('hidden'); }
function closeRates() { $('#rates').classList.add('hidden'); }
$('#rList').addEventListener('click', ev => {

/* ---------- currency picker (Latest favourites, or From/To in the custom-rate form) ---------- */
function renderPicker() {

}
function openPicker(forField) {

  $('#pClose').textContent = forField ? 'Cancel' : 'Done';

}

$('#pSearch').addEventListener('input', renderPicker);
$('#pList').addEventListener('click', ev => {

$('#pClose').addEventListener('click', closePicker);

/* ---------- custom-rate form ---------- */
const F = { from: 'USD', to: 'IDR' };
const num = s => parseFloat(String(s).replace(/,/g, ''));
function curBtn(c) { return `${flagOf(c)} <b>${c}</b> <small>${esc(nameOf(c))}</small>`; }
function syncForm() {
  $('#fFrom').innerHTML = curBtn(F.from); $('#fTo').innerHTML = curBtn(F.to);
  $('#lFrom').textContent = $('#lGave').textContent = F.from;
  $('#lTo').textContent = $('#lGot').textContent = F.to;
  const dup = F.from !== F.to ? pairOf(F.from, F.to, S.editId) : null;
  $('#fDup').textContent = dup ? `You already have a ${dup.from} → ${dup.to} rate (${fmtRate(dup.rate)}). Saving will replace it.` : '';
  updMkt();
}
// fromRates: the form was opened from the Rates list, so closing it goes back there.
function openSheet(x, fromRates) {
  S.editId = x ? x.id : null; S.fromRates = !!fromRates;
  $('#sTitle').textContent = x ? 'Edit custom rate' : 'Add custom rate';
  if (x) { F.from = x.from; F.to = x.to; }
  else {
    F.to = S.cActive || 'IDR';
    F.from = S.favs.find(c => c !== F.to && !pairOf(c, F.to)) || (F.to === 'USD' ? 'EUR' : 'USD');
  }
  $('#fRate').value = x ? String(x.rate) : '';
  $('#fNote').value = x ? x.note || '' : '';
  $('#fDate').value = x ? x.date || today() : today();
  $('#fGave').value = $('#fGot').value = ''; $('#fCalc').open = false;
  syncForm();
  $('#sheet').classList.remove('hidden');
}
// Live "vs market" line in the form.
function updMkt() {
  const from = F.from, to = F.to, r = num($('#fRate').value);
  const mk = convert(1, from, to);
  if (from === to || !isFinite(mk)) { $('#fMkt').innerHTML = ''; return; }
  let h = `Market: 1 ${from} = ${fmtRate(mk)} ${to}`;
  if (r > 0) {
    h += ' · yours is ' + pctHtml((r - mk) / mk * 100, true);
    const g = num($('#fGave').value), t = num($('#fGot').value);
    if (g > 0) {
      const got = t > 0 ? t : g * r, mkt = g * mk, diff = got - mkt;
      h += `<br>For ${fmt(g, from)} ${from}, market would give ${fmt(mkt, to)} ${to}. You got <span class="${diff >= 0 ? 'pos' : 'neg'}">${fmt(Math.abs(diff), to)} ${to} ${diff >= 0 ? 'more' : 'less'}</span>.`;
    }
  }
  $('#fMkt').innerHTML = h;
}
$('#fFrom').addEventListener('click', () => openPicker('from'));
$('#fTo').addEventListener('click', () => openPicker('to'));
$('#fSwap').addEventListener('click', () => {
  [F.from, F.to] = [F.to, F.from];
  const r = num($('#fRate').value); if (r > 0) $('#fRate').value = String(+(1 / r).toPrecision(8));
  syncForm();
});
$('#fLatest').addEventListener('click', () => {
  const v = convert(1, F.from, F.to);
  if (isFinite(v)) $('#fRate').value = String(+v.toPrecision(8)); else toast('No market rate saved yet');
  updMkt();
});
function calcFromAmounts() {
  const g = num($('#fGave').value), t = num($('#fGot').value);
  if (g > 0 && t > 0) $('#fRate').value = String(+(t / g).toPrecision(8));
  updMkt();
}
$('#fRate').addEventListener('input', updMkt);
$('#fGave').addEventListener('input', calcFromAmounts);
$('#fGot').addEventListener('input', calcFromAmounts);
function closeSheet() { $('#sheet').classList.add('hidden'); if (S.fromRates) openRates(); }
$('#fCancel').addEventListener('click', closeSheet);
$('#fSave').addEventListener('click', () => {
  const from = F.from, to = F.to, rate = num($('#fRate').value);
  if (from === to) return toast('Pick two different currencies');
  if (!(rate > 0)) return toast('Enter a rate above 0');
  const old = S.custom.find(y => y.id === S.editId);
  const dup = pairOf(from, to, S.editId);           // same pair already saved: replace it
  const id = S.editId || (dup && dup.id) || String(Date.now());
  const item = { id, from, to, rate, note: $('#fNote').value.trim(), date: $('#fDate').value };
  let list = S.custom.filter(y => !(dup && y.id === dup.id && y.id !== id));
  if (list.some(y => y.id === id)) list = list.map(y => y.id === id ? item : y); else list.unshift(item);
  S.custom = list;
  // New rate (or currencies changed): show it, starting from the amount you gave (or 100).
  if (!old || old.from !== from || old.to !== to) {
    const g = num($('#fGave').value);
    S.cActive = from; S.cExpr = g > 0 ? plain(g, from) : '100'; S.fresh = true;
  }
  save(); render(); closeSheet();
});
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', ev => {
  if (ev.target !== s) return;
  if (s.id === 'picker') closePicker(); else if (s.id === 'sheet') closeSheet(); else s.classList.add('hidden');
}));

/* ---------- saved prices: ☆ a price, then compare the same item across shops ---------- */
const SYM = { USD: 'US$', SGD: 'S$', AUD: 'A$', NZD: 'NZ$', HKD: 'HK$', CAD: 'C$', TWD: 'NT$', EUR: '€', GBP: '£', JPY: '¥', CNY: 'CN¥', KRW: '₩', INR: '₹', IDR: 'Rp ', MYR: 'RM ', THB: '฿', PHP: '₱', VND: '₫', CHF: 'CHF ' };
function money(v, c) { return SYM[c] ? SYM[c] + fmt(v, c) : fmt(v, c) + ' ' + c; }
// Convert with the rates of the mode you're in: market rates, or (in Mine) your own rate for that pair.
function modeConvert(v, from, to) {
  if (from === to) return v;
  if (S.mode === 'custom') { const d = directRate(from, to); return d ? v * d.r : NaN; }
  return convert(v, from, to);
}
function whenText(t) {
  const d = new Date(t), day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const n = Math.round((day(new Date()) - day(d)) / 864e5);
  if (n === 0) return 'Today ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (n === 1) return 'Yesterday';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
const uniqNames = arr => { const seen = new Set(); return arr.filter(x => { const k = (x || '').toLowerCase(); if (!k || seen.has(k)) return false; seen.add(k); return true; }); };

// Save sheet: the price is saved in the currency of the highlighted row.
let pendingSave = null;
function openSave() {
  const custom = S.mode === 'custom', c = custom ? S.cActive : S.active, v = evalExpr(custom ? S.cExpr : S.expr);
  if (!(v > 0)) return toast('Type a price first');
  pendingSave = { amount: +v.toFixed(8), cur: c };
  $('#svPrice').textContent = money(v, c);
  $('#svIn').textContent = 'Saved in ' + c;
  $('#svItem').value = ''; $('#svShop').value = '';
  renderSaveChips();
  $('#saveSheet').classList.remove('hidden');
}
function renderSaveChips() {
  const chips = (field, names) => names.slice(0, 8).map(n =>
    `<button class="chip${$(field).value.trim().toLowerCase() === n.toLowerCase() ? ' on' : ''}" data-v="${esc(n)}">${esc(n)}</button>`).join('');
  $('#svItems').innerHTML = chips('#svItem', uniqNames(S.saved.map(x => x.item)));
  $('#svShops').innerHTML = chips('#svShop', uniqNames(S.saved.map(x => x.shop)));
}
[['#svItems', '#svItem'], ['#svShops', '#svShop']].forEach(([box, field]) => {
  $(box).addEventListener('click', ev => { const b = ev.target.closest('.chip'); if (b) { $(field).value = b.dataset.v; renderSaveChips(); } });
  $(field).addEventListener('input', renderSaveChips);
});
$('#svCancel').addEventListener('click', () => $('#saveSheet').classList.add('hidden'));
$('#svSave').addEventListener('click', () => {
  if (!pendingSave) return;
  const it = { id: String(Date.now()), item: $('#svItem').value.trim(), shop: $('#svShop').value.trim(), amount: pendingSave.amount, cur: pendingSave.cur, t: Date.now() };
  S.saved.unshift(it); pendingSave = null;
  save(); $('#saveSheet').classList.add('hidden'); render();
  toast('★ Saved ' + money(it.amount, it.cur) + (it.item ? ' · ' + it.item : ''));
});

// Compare sheet: same item grouped, cheapest first, all shown in the currency you pick.
function cmpCurrencies() { return S.mode === 'custom' ? S.corder.slice() : S.favs.slice(); }
function openCompare() {
  const list = cmpCurrencies();
  if (!list.includes(S.cmpCur)) S.cmpCur = S.saved[0] && list.includes(S.saved[0].cur) ? S.saved[0].cur : list[0];
  save(); renderCompare();
  $('#cmpSheet').classList.remove('hidden');
}
function renderCompare() {
  const cur = S.cmpCur;
  $('#cmpIn').innerHTML = 'View in ' + cmpCurrencies().map(c => `<button class="chip${c === cur ? ' on' : ''}" data-c="${c}">${c}</button>`).join('');
  if (!S.saved.length) { $('#cmpList').innerHTML = '<div class="empty">No saved prices.<br>Type a price, then tap ☆ on the highlighted row to save it here.</div>'; return; }
  const groups = new Map();   // by item name, ignoring capitals; most recently saved item first
  S.saved.forEach(x => { const k = x.item.toLowerCase(); if (!groups.has(k)) groups.set(k, { items: [] }); groups.get(k).items.push(x); });
  groups.forEach(g => { g.name = g.items[g.items.length - 1].item || 'No name'; });   // spelling you first typed
  const pct = p => p < 1 ? p.toFixed(1) : String(Math.round(p));
  $('#cmpList').innerHTML = [...groups.values()].map(g => {
    const rows = g.items.map(x => ({ x, v: modeConvert(x.amount, x.cur, cur) }));
    const ok = rows.filter(r => isFinite(r.v)).sort((a, b) => a.v - b.v), none = rows.filter(r => !isFinite(r.v));
    const min = ok.length ? ok[0].v : NaN, n = rows.length;
    return `<div class="grp"><div class="gh"><b>${esc(g.name)}</b><small>${n} price${n === 1 ? '' : 's'}</small></div>` + ok.concat(none).map(r => {
      const x = r.x, same = x.cur === cur, conv = isFinite(r.v);
      let tag = '';
      if (conv && ok.length > 1) tag = r.v - min < 1e-9 * Math.max(1, min) ? '<span class="badge">Cheapest</span>' : `<span class="more">+${pct((r.v - min) / min * 100)}%</span>`;
      const main = conv ? (same ? '' : '≈ ') + money(r.v, cur) : '—';
      const sub = same ? '' : conv ? 'saved ' + money(x.amount, x.cur) : money(x.amount, x.cur) + ' · no ' + (S.mode === 'custom' ? 'Mine' : 'market') + ' rate to ' + cur;
      return `<div class="gr" data-id="${x.id}"><div class="shop">${esc(x.shop || 'No shop')}<small>${whenText(x.t)}</small></div>${tag}<div class="pr"><b>${main}</b>${sub ? '<small>' + sub + '</small>' : ''}</div><button class="del" data-act="del" aria-label="Delete">✕</button></div>`;
    }).join('') + '</div>';
  }).join('');
}
// Tap a saved price: put it back on the keypad (in its own currency).
function loadPrice(x) {
  if (S.mode === 'custom') {
    if (!S.corder.includes(x.cur)) return toast('None of your Mine rates use ' + x.cur);
    S.cActive = x.cur; S.cExpr = plain(x.amount, x.cur);
  } else {
    if (!S.favs.includes(x.cur)) S.favs.push(x.cur);
    S.active = x.cur; S.expr = plain(x.amount, x.cur);
  }
  S.fresh = true; save();
  $('#cmpSheet').classList.add('hidden'); showPad(); render();
}
$('#cmpIn').addEventListener('click', ev => { const b = ev.target.closest('[data-c]'); if (b) { S.cmpCur = b.dataset.c; save(); renderCompare(); } });
$('#cmpList').addEventListener('click', ev => {
  const row = ev.target.closest('.gr'); if (!row) return;
  const x = S.saved.find(y => y.id === row.dataset.id); if (!x) return;
  if (ev.target.closest('[data-act="del"]')) { S.saved = S.saved.filter(y => y !== x); save(); renderCompare(); render(); return; }
  loadPrice(x);
});
$('#cmpClear').addEventListener('click', () => {
  if (!S.saved.length || !confirm('Delete all saved prices?')) return;
  S.saved = []; save(); renderCompare(); render();
});
$('#cmpClose').addEventListener('click', () => $('#cmpSheet').classList.add('hidden'));
document.querySelectorAll('.cmpbtn').forEach(b => b.addEventListener('click', openCompare));

/* ---------- header ---------- */
$('#modeBtn').addEventListener('click', () => $('#modeMenu').classList.toggle('hidden'));
$('#modeMenu').addEventListener('click', ev => {
  const b = ev.target.closest('[data-mode]'); if (!b) return;
  $('#modeMenu').classList.add('hidden');
  if (b.dataset.mode === S.mode) return;
  S.mode = b.dataset.mode; S.editing = false; S.fresh = true; save(); render();
});
document.addEventListener('click', ev => { if (!ev.target.closest('.modewrap')) $('#modeMenu').classList.add('hidden'); });
document.querySelectorAll('.arrange').forEach(b => b.addEventListener('click', () => { S.editing = !S.editing; render(); }));
$('#refresh').addEventListener('click', () => fetchRates(true));
window.addEventListener('online', () => { renderStatus(); fetchRates(false); });
window.addEventListener('offline', renderStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); maybeRefresh(); } });
function maybeRefresh() { if (!S.rates || Date.now() - S.rates.fetched > 60 * 60 * 1000) fetchRates(false); }

if (!S.favs.includes(S.active)) S.active = S.favs[0];
render();
maybeRefresh();
setInterval(renderStatus, 60000);

// Offline support + updates: when a new version has been downloaded, reload once to show it.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloading) { reloading = true; location.reload(); }
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
</script>
</body>
</html>
